name: Uptime check

on:
  schedule:
    # Every 6 hours
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check public routes
        env:
          SITE_URL: ${{ vars.NG_APP_SITE_URL }}
        run: |
          set -euo pipefail
          base="${SITE_URL:-https://devchronicle-hugo.web.app}"
          base="${base%/}"
          for path in "/" "/articles" "/challenges"; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 "$base$path")
            echo "$base$path → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "Expected 200 from $base$path"
              exit 1
            fi
          done
