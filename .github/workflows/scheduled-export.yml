name: Scheduled Firestore export

on:
  schedule:
    # Sundays 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check secrets
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Export skipped: FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID missing."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export journal
        if: steps.gate.outputs.run == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: >
          node scripts/export-firestore.mjs
          --project "${{ secrets.FIREBASE_PROJECT_ID }}"
          --out "exports/devchronicle-export.json"

      - name: Upload artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: devchronicle-firestore-export
          path: exports/devchronicle-export.json
          retention-days: 30

      - name: Skip export
        if: steps.gate.outputs.run != 'true'
        run: echo "Scheduled export skipped. The job stays green."
