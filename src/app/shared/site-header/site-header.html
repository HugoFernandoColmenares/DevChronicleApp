<header class="bar">
  <div class="container-fluid bar__inner">
    <a class="brand" routerLink="/" aria-label="DevChronicle, inicio">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" focusable="false">
          <rect x="1" y="1" width="30" height="30" rx="3" class="brand__mark-plate" />
          <path
            class="brand__mark-rule"
            d="M7 11h18M7 16h18M7 21h12"
            fill="none"
            stroke-width="1.6"
            stroke-linecap="round"
          />
          <text x="22" y="24" class="brand__mark-dc" text-anchor="middle">DC</text>
        </svg>
      </span>
      <span class="brand__name">{{ siteName }}</span>
    </a>

    <nav class="nav" aria-label="Principal">
      <dev-service-status />
      <a
        routerLink="/"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Diario
      </a>
      <a routerLink="/articles" routerLinkActive="nav__link--active">Artículos</a>
      <a routerLink="/challenges" routerLinkActive="nav__link--active">Challenges</a>
      @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="nav__link--active">Estudio</a>
      }
    </nav>
  </div>
</header>
