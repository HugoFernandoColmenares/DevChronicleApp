<article class="card" [class.card--featured]="featured()" [class.card--compact]="compact()">
  <div class="card__meta">
    @let when = article().publishedAt ?? article().updatedAt;
    <time [attr.datetime]="when">{{ when | date: 'MMM d, y' }}</time>
    <span>{{ article().readingTimeMinutes }} min</span>
    <span>{{ article().author }}</span>
  </div>

  <h2 class="card__title">
    <a [routerLink]="['/post', article().slug]">{{ article().title }}</a>
  </h2>

  <p class="card__excerpt">{{ article().summary }}</p>

  <div class="card__tags">
    @for (tag of article().tags; track tag) {
      <dev-tag [label]="tag" />
    }
  </div>
</article>
