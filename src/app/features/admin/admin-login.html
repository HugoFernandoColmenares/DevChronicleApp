<section class="studio">
  <div class="studio__narrow">
    @if (ready()) {
      <p class="studio__kicker">Estudio</p>
      <h1>Inicia sesión para editar el diario.</h1>
      <p class="studio__lead">
        Google es el único método de acceso. La cuenta solo puede escribir entradas cuando su id de
        usuario existe en <span class="studio__code">admins</span>.
      </p>
      <button
        type="button"
        class="btn btn--primary"
        [disabled]="busy()"
        (click)="continueWithGoogle()"
      >
        Continuar con Google
      </button>
    } @else {
      <p class="empty">Verificando la sesión.</p>
    }
  </div>
</section>
