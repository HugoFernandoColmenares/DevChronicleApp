<section class="studio">
  <div class="studio__narrow">
    @if (ready()) {
      <p class="studio__kicker">Estudio</p>
      <h1>Inicia sesión para editar el diario.</h1>
      <p class="studio__lead">
        En producción solo se entra con Google. La cuenta puede escribir entradas únicamente si su
        identificador está en la lista de autores autorizados.
      </p>
      <div class="studio__actions">
        <button
          type="button"
          class="btn btn--primary"
          [disabled]="busy()"
          (click)="continueWithGoogle()"
        >
          Continuar con Google
        </button>
        @if (emulatorAuth) {
          <button
            type="button"
            class="btn"
            data-testid="emulator-admin-signin"
            [disabled]="busy()"
            (click)="continueWithEmulatorAdmin()"
          >
            Autor del emulador
          </button>
        }
      </div>
    } @else {
      <p class="empty">Verificando la sesión.</p>
    }
  </div>
</section>
