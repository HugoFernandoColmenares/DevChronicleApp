<section class="studio">
  <div class="studio__narrow">
    @if (ready()) {
      <p class="studio__kicker">Studio</p>
      <h1>Sign in to edit the journal.</h1>
      <p class="studio__lead">
        Google is the only production sign-in. The account can write entries only when its user id
        exists in the author allow-list.
      </p>
      <div class="studio__actions">
        <button
          type="button"
          class="btn btn--primary"
          [disabled]="busy()"
          (click)="continueWithGoogle()"
        >
          Continue with Google
        </button>
        @if (emulatorAuth) {
          <button
            type="button"
            class="btn"
            data-testid="emulator-admin-signin"
            [disabled]="busy()"
            (click)="continueWithEmulatorAdmin()"
          >
            Emulator author
          </button>
        }
      </div>
    } @else {
      <p class="empty">Checking the session.</p>
    }
  </div>
</section>
