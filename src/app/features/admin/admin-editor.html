<section class="studio">
  <div class="container-fluid">
    <dev-studio-bar [heading]="editingSlug() ? 'Editar entrada' : 'Nueva entrada'" />

    @if (loading()) {
      <p class="empty">Cargando la entrada.</p>
    } @else {
      <div class="studio__editor">
        <form class="studio__form" [formGroup]="form" (submit)="$event.preventDefault()">
          <label class="field">
            <span>Título</span>
            <input type="text" formControlName="title" autocomplete="off" />
          </label>

          <div class="field-row">
            <label class="field">
              <span>Slug</span>
              <input
                type="text"
                formControlName="slug"
                autocomplete="off"
                (input)="markSlugTouched()"
              />
            </label>
            <label class="field">
              <span>Autor</span>
              <input type="text" formControlName="author" autocomplete="name" />
            </label>
          </div>

          <label class="field">
            <span>Resumen</span>
            <input type="text" formControlName="summary" />
          </label>

          <div class="field-row">
            <label class="field">
              <span>Categoría</span>
              <input type="text" formControlName="category" />
            </label>
            <label class="field">
              <span>Serie</span>
              <input type="text" formControlName="series" />
            </label>
          </div>

          <div class="field-row">
            <label class="field">
              <span>Etiquetas</span>
              <input type="text" formControlName="tags" placeholder="angular, diario" />
            </label>
            <label class="field">
              <span>Publicado el</span>
              <input type="date" formControlName="publishedOn" />
            </label>
          </div>

          <label class="field">
            <span>Markdown · {{ minutes() }} min</span>
            <textarea formControlName="markdown" spellcheck="true"></textarea>
          </label>

          <div class="studio__actions">
            <button type="button" class="btn" [disabled]="saving()" (click)="save('draft')">
              Guardar borrador
            </button>
            <button
              type="button"
              class="btn btn--primary"
              [disabled]="saving()"
              (click)="save('published')"
            >
              Publicar
            </button>
            @if (editingSlug()) {
              <button type="button" class="btn btn--quiet" [disabled]="saving()" (click)="remove()">
                Eliminar
              </button>
            }
          </div>
        </form>

        <aside class="preview" aria-label="Vista previa de Markdown">
          <h2>Vista previa</h2>
          <div class="article-canvas">
            <h3 class="preview__title">{{ title() || 'Sin título' }}</h3>
            <div
              class="markdown-body"
              [innerHTML]="previewHtml()"
              [devCodeBlocks]="previewHtml()"
            ></div>
          </div>
        </aside>
      </div>
    }
  </div>
</section>
