<header class="studio__bar">
  <div>
    <p class="studio__kicker">Studio</p>
    <h1>{{ heading() }}</h1>
    @if (user(); as account) {
      @if (account.email) {
        <p class="studio__who">{{ account.email }}</p>
      }
    }
    <nav class="studio__tabs" aria-label="Studio sections">
      <a
        routerLink="/admin"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Articles</a
      >
      <a routerLink="/admin/challenges" routerLinkActive="is-active">Challenges</a>
    </nav>
  </div>
  <div class="studio__actions">
    @if (showExport()) {
      <button
        type="button"
        class="btn"
        data-testid="export-backup"
        [disabled]="exporting()"
        (click)="exportRequested.emit()"
      >
        {{ exporting() ? 'Exporting…' : 'Export backup' }}
      </button>
    }
    @if (showNew()) {
      <a class="btn btn--primary" [routerLink]="newLink()">{{ newLabel() }}</a>
    } @else {
      <a class="btn" routerLink="/admin">All entries</a>
    }
    <button type="button" class="btn" (click)="signOut()">Sign out</button>
  </div>
</header>
