<header class="studio__bar">
  <div>
    <p class="studio__kicker">Estudio</p>
    <h1>{{ heading() }}</h1>
    @if (user(); as account) {
      @if (account.email) {
        <p class="studio__who">{{ account.email }}</p>
      }
    }
    <nav class="studio__tabs" aria-label="Secciones del Estudio">
      <a
        routerLink="/admin"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Artículos</a
      >
      <a routerLink="/admin/challenges" routerLinkActive="is-active">Desafíos</a>
    </nav>
  </div>
  <div class="studio__actions">
    @if (showExport()) {
      <button
        type="button"
        class="btn"
        data-testid="export-backup"
        [disabled]="exporting()"
        (click)="exportRequested.emit()"
      >
        {{ exporting() ? 'Exportando…' : 'Exportar copia de seguridad' }}
      </button>
    }
    @if (showNew()) {
      <a class="btn btn--primary" [routerLink]="newLink()">{{ newLabel() }}</a>
    } @else {
      <a class="btn" routerLink="/admin">Todas las entradas</a>
    }
    <button type="button" class="btn" (click)="signOut()">Cerrar sesión</button>
  </div>
</header>
